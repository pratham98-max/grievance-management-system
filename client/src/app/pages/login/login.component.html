<div class="min-h-screen flex items-center justify-center bg-brand-light font-sans selection:bg-brand-accent selection:text-white px-4">
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <div class="bg-brand-dark p-8 text-center">
      <div class="flex justify-center items-center gap-2 mb-2">
        <svg class="text-brand-accent h-8 w-8" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
      <p class="text-brand-accent text-sm mt-1">NatureTek Support Portal</p>
    </div>

    <div class="p-8">
      <form class="space-y-6" (ngSubmit)="onLogin()">
        
        <div *ngIf="errorMessage" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
          {{ errorMessage }}
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input type="email" name="email" [(ngModel)]="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent outline-none transition-all" />
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-sm text-brand-dark hover:text-brand-accent font-medium">Forgot password?</a>
          </div>
          <input type="password" name="password" [(ngModel)]="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent outline-none transition-all" />
        </div>

        <button type="submit" [disabled]="isLoading" class="w-full bg-brand-dark text-white font-bold py-3 rounded-lg hover:bg-[#13442a] transition-colors shadow-md disabled:opacity-70">
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>

      </form>

      <div class="mt-8 text-center text-sm text-gray-600">
        Don't have an account? 
        <a routerLink="/register" class="text-brand-dark font-bold hover:text-brand-accent transition-colors">Register here</a>
      </div>
      
      <div class="mt-4 text-center">
        <a routerLink="/" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">← Back to Home</a>
      </div>
    </div>
  </div>
</div>
