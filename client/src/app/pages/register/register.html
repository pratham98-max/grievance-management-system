<div class="min-h-screen flex items-center justify-center bg-brand-light font-sans selection:bg-brand-accent selection:text-white px-4 py-10">
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <div class="bg-brand-dark p-8 text-center">
      <h2 class="text-2xl font-bold text-white">Create an Account</h2>
      <p class="text-brand-accent text-sm mt-1">Join the NatureTek Support Portal</p>
    </div>

    <div class="p-8">
      <form class="space-y-5">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
          <input type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input type="password" placeholder="Create a strong password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
          <input type="password" placeholder="Repeat your password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all" />
        </div>

        <button type="button" class="w-full bg-brand-accent text-white font-bold py-3 rounded-lg hover:bg-[#6ba038] transition-colors shadow-md mt-2">
          Create Account
        </button>

      </form>

      <div class="mt-8 text-center text-sm text-gray-600">
        Already have an account? 
        <a routerLink="/login" class="text-brand-dark font-bold hover:text-brand-accent transition-colors">Sign in here</a>
      </div>
    </div>
  </div>
</div>
