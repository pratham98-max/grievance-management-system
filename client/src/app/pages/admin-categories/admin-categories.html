<div class="min-h-screen flex bg-gray-50 font-sans text-gray-800">
  <aside class="w-64 bg-brand-dark text-white flex flex-col hidden md:flex">
    <div class="p-6 border-b border-white/10">
      <h2 class="text-xl font-bold tracking-wide">NatureTek</h2>
      <p class="text-brand-accent text-xs mt-1 uppercase tracking-wider font-semibold">Admin Command</p>
    </div>
    <nav class="flex-grow py-6 px-4 space-y-2">
      <a routerLink="/admin/dashboard" class="block px-4 py-3 hover:bg-white/5 rounded-lg text-sm text-gray-300 transition-colors">
        Master Ticket Pool
      </a>
      <a routerLink="/admin/categories" class="block px-4 py-3 bg-white/10 rounded-lg text-sm font-medium text-white transition-colors">
        Manage Categories
      </a>
      <a routerLink="/admin/employees" class="block px-4 py-3 hover:bg-white/5 rounded-lg text-sm text-gray-300 transition-colors">
        Employee Directory
      </a>
    </nav>
    <div class="p-4 border-t border-white/10">
      <button routerLink="/" class="w-full px-4 py-2 bg-red-500/20 text-red-200 hover:bg-red-500/40 hover:text-white rounded transition-colors text-sm font-medium">
        Logout
      </button>
    </div>
  </aside>

  <main class="flex-grow flex flex-col h-screen overflow-hidden">
    <header class="bg-white px-8 py-5 border-b border-gray-200 flex justify-between items-center shadow-sm z-10">
      <h1 class="text-2xl font-bold text-brand-dark">Manage Grievance Categories</h1>
    </header>

    <div class="p-8 overflow-y-auto flex-grow grid md:grid-cols-3 gap-8 items-start">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:col-span-1">
        <h2 class="text-lg font-bold text-brand-dark mb-4 border-b border-gray-100 pb-2">Add Category</h2>
        <form (ngSubmit)="saveCategory()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category Name</label>
            <input [(ngModel)]="newCategory.name" name="name" type="text" placeholder="e.g., Battery Storage" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-accent outline-none text-sm" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea [(ngModel)]="newCategory.description" name="description" rows="3" placeholder="Brief explanation..." 
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-accent outline-none text-sm resize-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-brand-dark text-white font-bold py-2 rounded-lg hover:bg-[#13442a] transition-colors text-sm">
            Save Category
          </button>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden md:col-span-2">
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
          <h2 class="font-bold text-gray-800">Active Categories</h2>
          <span class="text-xs text-gray-500 font-semibold uppercase tracking-wider">{{ categories.length }} Configured</span>
        </div>
        
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-xs font-bold uppercase bg-white text-gray-500 border-b border-gray-200">
              <th class="px-6 py-3">Category Name</th>
              <th class="px-6 py-3">Description</th>
              <th class="px-6 py-3 text-center">Status</th>
              <th class="px-6 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 text-sm">
            <tr *ngFor="let cat of categories" class="hover:bg-gray-50/50 transition-colors">
              <td class="px-6 py-4 font-bold text-brand-dark">{{ cat.name }}</td>
              <td class="px-6 py-4 text-gray-600 text-xs">{{ cat.description }}</td>
              <td class="px-6 py-4 text-center">
                <span [ngClass]="cat.status === 'ACTIVE' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-gray-200 text-gray-500'"
                      class="px-2 py-1 rounded text-xs font-bold border">{{ cat.status || 'ACTIVE' }}</span>
              </td>
              <td class="px-6 py-4 text-right space-x-3">
                <button (click)="toggleStatus(cat)" class="text-brand-accent font-medium hover:text-brand-dark transition-colors">
                  {{ cat.status === 'ACTIVE' ? 'Disable' : 'Enable' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
